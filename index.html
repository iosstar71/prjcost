<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Hub Cost</title>
  <link rel="stylesheet" href="assets/app.css" />
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("prjcost.theme") || "light"; } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i data-icon="coin"></i></span>
      <h1>PM Hub Cost</h1>
      <span class="ver" id="verBadge"></span>
    </div>
    <div class="bar-group grow">
      <button class="folder-chip off" id="folderChip" data-act="connectFolder" title="프로젝트 엑셀을 읽고 쓰는 폴더 — 눌러서 바꾸기"><i data-icon="folder"></i><span class="name">폴더 연결</span></button>
      <select id="projectSelect" data-act="openSelected" aria-label="프로젝트 목록"></select>
      <button class="btn" data-act="newProject"><i data-icon="plus"></i>새 프로젝트</button>
      <label class="btn file-btn" title="이 프로그램으로 저장한 엑셀 또는 업로드 양식을 엽니다"><i data-icon="upload"></i>엑셀 열기<input type="file" accept=".xlsx" id="uploadInput" /></label>
    </div>
    <div class="bar-group">
      <button class="btn icon-only" data-act="undo" id="btnUndo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기"><i data-icon="undo"></i></button>
      <button class="btn icon-only" data-act="redo" id="btnRedo" title="다시 하기 (Ctrl+Y)" aria-label="다시 하기"><i data-icon="redo"></i></button>
      <span class="save-state" id="saveState"></span>
      <button class="btn" data-act="exportReport" title="통합보고 · 항목별 상세 · 투입현황 엑셀"><i data-icon="report"></i>보고서</button>
      <button class="btn" data-act="saveVersion" title="지금 자료를 이름(초기 계획 · 실계약 · 수정계약 …)과 메모를 붙여 남기고 저장"><i data-icon="flag"></i>버전 저장</button>
      <button class="btn primary" data-act="save" title="Ctrl+S"><i data-icon="save"></i>저장</button>
      <button class="btn" data-act="toggleTheme" id="btnTheme" title="밝게 / 어둡게"></button>
    </div>
  </header>

  <main class="workspace">
    <div class="notice warn" id="noticeBox" hidden></div>

    <section class="kpis" aria-label="요약">
      <div class="kpi"><span class="kpi-label"><i data-icon="coin"></i>계약 매출</span><span class="kpi-val" id="kRev">0</span><span class="kpi-sub" id="kRevSub">견적 미등록</span></div>
      <div class="kpi"><span class="kpi-label"><i data-icon="calc"></i>총 원가</span><span class="kpi-val" id="kCost">0</span><span class="kpi-sub" id="kCostSub"></span><div class="mix" id="kMix"></div></div>
      <div class="kpi" id="kMarginCard"><span class="kpi-label"><i data-icon="chart"></i>예상 이익률</span><span class="kpi-val" id="kMargin">0.0%</span><span class="kpi-sub" id="kProfit">이익 0원</span></div>
      <div class="kpi" id="kHurdleCard"><span class="kpi-label"><i data-icon="target"></i>목표 허들 대비</span><span class="kpi-val" id="kHurdle">-</span><span class="kpi-sub" id="kHurdleSub"></span></div>
    </section>

    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section class="panel" id="panel"></section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/model.js"></script>
  <script src="js/workbook.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
